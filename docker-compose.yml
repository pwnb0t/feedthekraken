services:
  app:
    build: .
    container_name: meteor_app
    ports:
      - "3000:3000"
    environment:
      ROOT_URL: "https://kraken.pwnb0t.com"
      MONGO_URL: "mongodb://mongo:27017/meteor"
      PORT: "3000"
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:4.4
    container_name: meteor_mongo
    command:
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - "0.25"
      - --setParameter
      - diagnosticDataCollectionEnabled=false
      - --profile
      - "0"
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:

